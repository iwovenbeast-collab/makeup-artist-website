<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment | Rupanjali’s Makeup Artistry</title>
  <meta name="description" content="Book your makeup appointment with Rupanjali’s Makeup Artistry. Available across India." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Theme -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            peach: '#F6C1B1',
            blush: '#FADADD'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-blush via-white to-peach min-h-screen">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-lg font-bold text-pink-600">RUPANJALI’S MAKEUP ARTISTRY</h1>
      <a href="index.html" class="text-sm text-gray-600 hover:text-pink-600">← Back to Home</a>
    </div>
  </header>

  <!-- Booking Form -->
  <section class="py-16">
    <div class="max-w-3xl mx-auto px-6">

      <div class="bg-white rounded-3xl shadow-xl p-8 md:p-12">
        <h2 class="text-3xl font-bold text-center mb-2">Book Your Date</h2>
        <p class="text-center text-gray-600 mb-10">Fill in the details and we’ll get back to you shortly</p>

        <form id="bookingForm" class="space-y-6">

          <!-- Name -->
          <div>
            <label class="block text-sm font-medium mb-1">Full Name</label>
            <input type="text" name="name" required placeholder="Your name" class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-pink-400 focus:outline-none" />
          </div>

          <!-- Phone -->
          <div>
            <label class="block text-sm font-medium mb-1">Phone / WhatsApp</label>
            <input type="tel" name="phone" required placeholder="10-digit mobile number" class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-pink-400 focus:outline-none" />
          </div>

          <!-- Email -->
          <div>
            <label class="block text-sm font-medium mb-1">Email (optional)</label>
            <input type="email" name="email" placeholder="your@email.com" class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-pink-400 focus:outline-none" />
          </div>

          <!-- Event Type -->
          <div>
            <label class="block text-sm font-medium mb-1">Event Type</label>
            <select name="event_type" required class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-pink-400 focus:outline-none">
              <option value="">Select event</option>
              <option>Bridal Makeup</option>
              <option>Party Makeup</option>
              <option>Engagement Makeup</option>
              <option>Photoshoot Makeup</option>
              <option>Other</option>
            </select>
          </div>

          <!-- Event Date -->
          <div>
            <label class="block text-sm font-medium mb-1">Event Date</label>
            <input type="date" name="event_date" required class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-pink-400 focus:outline-none" />
          </div>

          <!-- Location -->
          <div>
            <label class="block text-sm font-medium mb-1">Event Location (City / State)</label>
            <input type="text" name="location" required placeholder="Kolkata, Mumbai, Delhi…" class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-pink-400 focus:outline-none" />
          </div>

          <!-- Message -->
          <div>
            <label class="block text-sm font-medium mb-1">Additional Message</label>
            <textarea name="message" rows="4" placeholder="Any specific requirements…" class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-pink-400 focus:outline-none"></textarea>
          </div>

          <!-- Submit -->
          <div class="pt-4">
            <button type="submit" class="w-full py-4 bg-pink-600 text-white rounded-full font-semibold shadow-lg hover:bg-pink-700 transition">
              Submit Booking Request
            </button>
          </div>

        </form>

        <!-- Success Message (hidden) -->
        <div id="successMsg" class="hidden mt-6 text-center text-green-600 font-medium">
          Thank you! Your booking request has been submitted.
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="py-6 text-center text-sm text-gray-600">
    © 2026 Rupanjali’s Makeup Artistry · All Rights Reserved
  </footer>
  <script src="js/booking.js"></script>
</body>
</html>
